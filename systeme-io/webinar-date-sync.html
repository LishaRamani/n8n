<script>
/* Webinar date -> systeme.io
 *
 * Paste this whole block into a Raw HTML element on the page, then type
 *
 *     {{WEBINAR_DATE}}
 *
 * wherever the date should appear. Styling is untouched - only that text
 * is swapped for whatever column D of the sheet says.
 *
 * Scripts do not run in the systeme.io editor. Check the live page.
 */
(function () {
  'use strict';

  // The Apps Script /exec URL. Paste it between the quotes.
  var WEBINAR_DATE_URL = 'https://script.google.com/macros/s/AKfycbw3mHw2MrIStGoPwTojJoaGVQRyJEk0To7pBMliwHdosiUaSDIdAQSOGZSWJFMAyMCr-Q/exec';

  // Shown only if the script cannot be reached, so the page is never blank.
  var FALLBACK_DATE = 'Monday, 21 September 2026';

  var GIVE_UP_AFTER_MS = 4000;

  var TOKEN_RE = /\{\{\s*WEBINAR_DATE\s*\}\}/g;
  var SKIP_TAGS = { SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, TEXTAREA: 1 };
  var spots = [];
  var settled = false;

  function collectSpots() {
    var walker = document.createTreeWalker(
      document.body, NodeFilter.SHOW_TEXT,
      {
        acceptNode: function (n) {
          if (!n.nodeValue || n.nodeValue.indexOf('{{') === -1) return NodeFilter.FILTER_REJECT;
          if (n.parentNode && SKIP_TAGS[n.parentNode.nodeName]) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      },
      false
    );

    var node;
    while ((node = walker.nextNode())) {
      TOKEN_RE.lastIndex = 0;
      if (!TOKEN_RE.test(node.nodeValue)) continue;
      spots.push({ node: node, template: node.nodeValue, el: node.parentElement });
    }

    // Hide the raw {{WEBINAR_DATE}} so visitors never see it mid-load.
    spots.forEach(function (spot) {
      if (spot.el && spot.el.style) {
        spot.el.setAttribute('data-wds-prev-visibility', spot.el.style.visibility || '');
        spot.el.style.visibility = 'hidden';
      }
    });
  }

  function show(date) {
    if (settled) return;
    settled = true;

    spots.forEach(function (spot) {
      try { spot.node.nodeValue = spot.template.replace(TOKEN_RE, date); } catch (e) {}
      if (spot.el && spot.el.style) {
        spot.el.style.visibility = spot.el.getAttribute('data-wds-prev-visibility') || '';
        spot.el.removeAttribute('data-wds-prev-visibility');
      }
    });

    try {
      document.dispatchEvent(new CustomEvent('webinar-date-sync', { detail: { date: date } }));
    } catch (e) {}
  }

  function warn(message) {
    if (window.console && console.warn) console.warn('[webinar-date-sync]', message);
  }

  // Loaded as a <script>, which no browser CORS rule applies to.
  function load(done) {
    var name = 'wdsCb' + Math.floor(Math.random() * 1e9);
    var script = document.createElement('script');
    var finished = false;

    function finish(date, why) {
      if (finished) return;
      finished = true;
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      if (why) warn(why);
      done(date);
    }

    window[name] = function (data) {
      if (data && data.ok && data.date) finish(String(data.date), null);
      else finish(null, (data && data.error) || 'the script sent back no date');
    };
    script.onerror = function () { finish(null, 'could not load ' + WEBINAR_DATE_URL); };

    script.src = WEBINAR_DATE_URL +
      (WEBINAR_DATE_URL.indexOf('?') === -1 ? '?' : '&') +
      'callback=' + name +
      '&_=' + Math.floor(Date.now() / 60000);   // refresh at most once a minute

    (document.head || document.documentElement).appendChild(script);
  }

  function start() {
    collectSpots();
    if (!spots.length) return;

    setTimeout(function () { show(FALLBACK_DATE); }, GIVE_UP_AFTER_MS);

    if (!WEBINAR_DATE_URL) {
      warn('WEBINAR_DATE_URL is empty - paste your Apps Script /exec URL into it');
      return show(FALLBACK_DATE);
    }
    load(function (date) { show(date || FALLBACK_DATE); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
